<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>Desktop Pet</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div id="pet" class="pet-container">
    <div id="whip" class="whip"></div>
    <div id="speech-bubble" class="speech-bubble"></div>
    <div id="face" class="pet-face"></div>
    <div id="body" class="pet-body">
      <div class="leg leg-front-left"></div>
      <div class="leg leg-front-right"></div>
      <div class="leg leg-back-left"></div>
      <div class="leg leg-back-right"></div>
      <div class="tail"></div>
    </div>
  </div>
  <div id="cursor-companion" class="cursor-companion">💩</div>
  <script src="renderer.js"></script>
</body>
</html>
